name: Scrape

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (scrape + validate, no real writes)'
        type: boolean
        default: true

jobs:
  scrape:
    permissions:
      contents: write
      issues: write
    uses: peviitor-scrapers/Brewtality-3-16/.github/workflows/scrape-js-reusable.yml@main
